name: Nightly observations

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: mkdir -p nightly-artifacts
      # These observations do not block PRs. Run both workloads serially.
      - name: National benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          npm run bench -- --run --outputJson=nightly-artifacts/bench.json 2>&1 | tee nightly-artifacts/bench.log
      - name: Ten-year national golden
        if: always()
        continue-on-error: true
        env:
          NIGHTLY_GOLDEN: '1'
          UPDATE_GOLDEN: '0'
        run: |
          mkdir -p nightly-artifacts
          set -o pipefail
          npx vitest run tests/golden/s1560-nightly.spec.ts --minWorkers=1 --maxWorkers=1 --reporter=default --reporter=json --outputFile=nightly-artifacts/golden.json 2>&1 | tee nightly-artifacts/golden.log
      - name: Upload raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-observations
          path: nightly-artifacts/
          retention-days: 14
